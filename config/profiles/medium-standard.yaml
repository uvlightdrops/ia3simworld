# ============================================================================
# Simulation Profile: medium-standard
# ============================================================================
# Default world configuration for development
# 
# Characteristics:
# - 2560×2560 world (standard)
# - 200ms tick rate (5 ticks/sec)
# - 5 agents per node (default)
# - Ollama enabled
# - Balanced polling

world:
  width: 2560
  height: 2560
  tick_rate_ms: 200
  agents_per_node: 5
  terrain:
    river_width: 3
    lakes_density: 0.28
    berries_density: 0.25
    forest_density: 0.35
  settlements:
    count: 4
    min_distance: 70
  buildings:
    homes_per_settlement: 1
    farms_per_settlement: 1
    mills_per_settlement: 1
    forges_per_settlement: 1
    quarries_per_settlement: 1
    pottery_per_settlement: 1
    workshops_per_settlement: 1
    wells_per_settlement: 1
    spiritual_centers_per_settlement: 1
    markets_total: 1
    courts_total: 1
    storehouses_total: 1

ui:
  polling:
    compact_interval_ms: 1000
    full_state_interval_ms: 5000

ai:
  ollama:
    enabled: true
  agents:
    decide_period_ticks: 10

# ============================================================================
# Use this profile for:
# ============================================================================
# export PROFILE=medium-standard (or omit, it's default)
# ./scripts/dev/start.sh 1
# 
# Startup: ~20-30 seconds
# Good for: General development, feature testing, normal gameplay

# ============================================================================
# Simulation Profile: small-test
# ============================================================================
# Quick test world for unit tests and rapid iteration
# 
# Characteristics:
# - 512×512 world (16x smaller than standard)
# - 50ms tick rate (4x faster)
# - 2 agents (minimal simulation)
# - Ollama disabled (no LLM for testing)

world:
  width: 256
  height: 256
  tick_rate_ms: 50
  agents_per_node: 2
  terrain:
    lakes_density: 0.28
    berries_density: 0.25
  settlements:
    count: 1
    min_distance: 40
  buildings:
    homes_per_settlement: 1
    farms_per_settlement: 1
    mills_per_settlement: 1
    forges_per_settlement: 1
    quarries_per_settlement: 1
    pottery_per_settlement: 1
    workshops_per_settlement: 1
    wells_per_settlement: 1
    spiritual_centers_per_settlement: 1
    markets_total: 1
    courts_total: 1
    storehouses_total: 1

ui:
  polling:
    compact_interval_ms: 2000
    full_state_interval_ms: 5000

ai:
  ollama:
    enabled: false
